<title>COMP 202 coding</title>

<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:20px;color:#fff;
  font:15px/1.4 "Segoe UI","Frutiger","Dejavu Sans","Helvetica Neue",Arial,sans-serif;
  background:
    radial-gradient(ellipse 60% 45% at 18% 8%,rgba(255,255,255,.7),rgba(255,255,255,0) 70%),
    radial-gradient(ellipse 50% 40% at 88% 18%,rgba(190,235,255,.8),rgba(190,235,255,0) 70%),
    radial-gradient(ellipse 80% 45% at 50% 100%,rgba(8,50,110,.7),rgba(8,50,110,0) 70%),
    linear-gradient(165deg,#164f92 0%,#2f8ad0 40%,#7cc4ee 64%,#256fb5 100%);background-attachment:fixed}
.logon{width:100%;max-width:380px;text-align:center}
.tile{width:128px;height:128px;margin:0 auto 14px;padding:6px;border-radius:8px;
  background:linear-gradient(180deg,rgba(255,255,255,.75),rgba(180,210,240,.5));border:1px solid rgba(255,255,255,.85);
  box-shadow:0 0 0 1px rgba(0,30,70,.55),0 6px 18px rgba(0,20,60,.5)}
.tile svg{display:block;width:100%;height:100%;border-radius:3px}
h1{margin:0 0 14px;font-size:1.7rem;font-weight:400;text-shadow:0 1px 6px rgba(0,30,70,.9),0 0 2px rgba(0,30,70,.9)}
form{display:block}
.row{display:flex;gap:6px;justify-content:center;align-items:center}
input[type=password]{width:230px;height:32px;padding:3px 9px;font:inherit;color:#000;background:#fff;border:1px solid #1f4c7e;border-radius:3px;
  box-shadow:inset 0 1px 3px rgba(0,0,0,.3);outline:none}
input[type=password]:focus{box-shadow:inset 0 1px 3px rgba(0,0,0,.3),0 0 0 2px #7fd0ff}
.go{width:32px;height:32px;padding:0;border:1px solid #14502f;border-radius:4px;cursor:pointer;color:#fff;font:700 18px/1 "Segoe UI",Arial,sans-serif;
  background:linear-gradient(180deg,#8fe0a6 0,#3fb561 48%,#1f9a45 52%,#52c872);box-shadow:inset 0 0 0 1px rgba(255,255,255,.55),0 1px 3px rgba(0,0,0,.4);
  text-shadow:0 0 3px rgba(0,60,20,.8)}
.go:hover{filter:brightness(1.1)}
.go:active{filter:brightness(.92);box-shadow:inset 0 2px 4px rgba(0,60,20,.6)}
.go:focus-visible{outline:2px solid #fff;outline-offset:2px}
.go:disabled{filter:grayscale(.7);cursor:wait}
.hint{margin:16px 0 8px;font-size:.9rem;text-shadow:0 1px 4px rgba(0,30,70,.9)}
.keep{display:inline-flex;gap:8px;align-items:center;font-size:.9rem;cursor:pointer;text-shadow:0 1px 4px rgba(0,30,70,.9)}
#msg{margin:14px auto 0;min-height:1.5em;max-width:300px;font-weight:700;color:#fff;text-shadow:0 1px 4px rgba(120,0,0,.95),0 0 2px rgba(120,0,0,.95)}
</style>
</head>

const KEYSTORE='comp202-unlock-key';
const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const te=new TextEncoder();
async function deriveKey(pw){
  const base=await crypto.subtle.importKey('raw',te.encode(pw),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(P.salt),iterations:P.iter,hash:'SHA-256'},base,{name:'AES-GCM',length:256},true,['decrypt']);
}
async function openWith(key){
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(P.iv)},key,b64(P.ct));
  const html=await new Response(new Blob([pt]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).text();
  document.open();document.write(html);document.close();
}
(async()=>{
  try{
    const saved=localStorage.getItem(KEYSTORE);
    if(saved){const key=await crypto.subtle.importKey('raw',b64(saved),'AES-GCM',false,['decrypt']);await openWith(key)}
  }catch(e){try{localStorage.removeItem(KEYSTORE)}catch(_){}}
})();
document.getElementById('f').addEventListener('submit',async ev=>{
  ev.preventDefault();
  const msg=document.getElementById('msg'),btn=document.getElementById('go');
  msg.textContent='';btn.disabled=true;
  try{
    if(!window.crypto||!crypto.subtle)throw new Error('nocrypto');
    const key=await deriveKey(document.getElementById('pw').value);
    if(document.getElementById('keep').checked){
      try{const raw=await crypto.subtle.exportKey('raw',key);localStorage.setItem(KEYSTORE,btoa(String.fromCharCode(...new Uint8Array(raw))))}catch(_){}
    }
    await openWith(key);
  }catch(e){
    try{localStorage.removeItem(KEYSTORE)}catch(_){}
    msg.textContent=e.message==='nocrypto'?'This browser cannot unlock the page over an insecure connection. Use the https address.':'The password is incorrect. Please try again.';
    btn.disabled=false;
  }
});
})();
